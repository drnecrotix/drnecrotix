name: Metrics

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: drnecrotix
          
          # ==========================================
          # Промяна на ШАБЛОНА (напр. classic, terminal, repository, compact, markdown, community)
          template: compact
          # ==========================================

          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Sofia
          
          # Дизайн и анимация за черен/минималистичен фон
          style_svg: |
            @keyframes fade-in {
              from { opacity: 0; }
              to { opacity: 1; }
            }
            .core { animation: fade-in 1s ease-in-out; }

          # Плъгини за визуализация на активността
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_lines: yes
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
